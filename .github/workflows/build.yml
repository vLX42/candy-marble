name: Build

# Every push: tests + level bots, then Windows / macOS / Linux / Web exports.
# Pushes to main: the version is worked out from the commit messages since the
# last release (tools/next_version.py: feat = minor, fix/other = patch,
# ! or BREAKING = major, docs/ci/test/chore only = no release), stamped into
# the builds and the site, the site goes to GitHub Pages and a GitHub release
# with the three desktop zips and grouped notes is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSfL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import assets
        run: godot --headless --import || godot --headless --import

      - name: Tests
        run: |
          set -e
          for t in playtest race_test hazards_test madness_test flow_test touch_test editor_test sections_test original_test; do
            echo "::group::$t"
            godot --headless --fixed-fps 120 -s tests/$t.gd
            echo "::endgroup::"
          done

      - name: Level bots
        run: |
          set -e
          godot --headless --fixed-fps 120 -s tests/levels_test.gd
          godot --headless --fixed-fps 120 -s tests/levels_test.gd -- --quest=res://quests/marble_madness.json
          godot --headless --fixed-fps 120 -s tests/levels_test.gd -- --quest=res://quests/madness_returns.json
          godot --headless --fixed-fps 120 -s tests/levels_test.gd -- --quest=res://quests/sweet_starter.json

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          python3 tools/next_version.py notes.md >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  export:
    needs: [test, version]
    if: always() && needs.test.result == 'success' && needs.version.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSfL -o godot.zip "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o templates.tpz "$GODOT_BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          NUM="${VERSION%%-*}"
          sed -i "s/^application\/short_version=.*/application\/short_version=\"$NUM\"/; s/^application\/version=.*/application\/version=\"$NUM\"/" export_presets.cfg
          sed -i "s/^application\/file_version=.*/application\/file_version=\"$NUM.0\"/; s/^application\/product_version=.*/application\/product_version=\"$NUM.0\"/" export_presets.cfg
          grep -n "config/version" project.godot

      - name: Import assets
        run: godot --headless --import || godot --headless --import

      - name: Export
        run: |
          set -e
          mkdir -p build/windows build/macos build/linux build/web dist
          godot --headless --export-release "Windows" build/windows/CandyMarble.exe
          godot --headless --export-release "macOS" build/macos/CandyMarble-macos.zip
          godot --headless --export-release "Linux" build/linux/CandyMarble.x86_64
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/*

      - name: Package
        run: |
          set -e
          (cd build/windows && zip -qr ../../dist/CandyMarble-windows.zip .)
          chmod +x build/linux/CandyMarble.x86_64
          (cd build/linux && zip -qr ../../dist/CandyMarble-linux.zip .)
          cp build/macos/CandyMarble-macos.zip dist/
          mkdir -p public
          cp -r site/. public/
          sed -i "s/{{VERSION}}/${{ needs.version.outputs.version || 'dev' }}/g" public/index.html
          cp -r build/web public/play
          ls -la dist public

      - uses: actions/upload-artifact@v4
        with:
          name: candy-marble-builds
          path: dist/*.zip

      - name: Upload site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pages:
    needs: [export]
    # The github-pages environment only accepts main; tags just make releases.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [export, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candy-marble-builds
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Candy Marble $VERSION" --notes-file notes.md
